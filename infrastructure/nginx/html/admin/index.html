<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Administración · Route Maps</title>
  <meta name="description" content="Panel de administración de la plataforma de mapas Route Maps.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/session.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/format.js">

<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <!-- Sign-in: only administrators and operators get past it. -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="login-form" novalidate>
      <img class="login__logo" src="/icons/icon.svg" width="56" height="56" alt="">
      <h1 class="login__title">Administración</h1>
      <p class="login__subtitle">Route Maps · para administradores y operadores</p>
      <p class="login__status" id="login-status" role="alert" hidden></p>
      <div class="field">
        <label class="field__label" for="login-email">Correo</label>
        <input class="input" id="login-email" type="email" autocomplete="username" required maxlength="254"
          inputmode="email" spellcheck="false">
      </div>
      <div class="field">
        <label class="field__label" for="login-password">Contraseña</label>
        <input class="input" id="login-password" type="password" autocomplete="current-password" required
          maxlength="128">
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="login-submit">Entrar</button>
      <p class="login__note">¿Primera vez? El primer administrador se crea en el servidor con
        <code>make admin-create EMAIL=tu@correo.com</code>.</p>
      <a class="login__back" href="/">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>Volver al mapa
      </a>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Menú del panel">
      <a class="sidebar__brand" href="#/resumen">
        <img src="/icons/icon.svg" width="36" height="36" alt="">
        <span><strong>Route Maps</strong><small>Administración</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="sidebar__footer">
        <a class="user-chip" id="user-chip" href="#/mi-cuenta" title="Mi cuenta"></a>
        <div class="sidebar__links">
          <a class="btn btn--ghost btn--small" href="/" target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-map"/></svg>Abrir el mapa
          </a>
          <a class="btn btn--ghost btn--small" href="/api/docs" target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-book"/></svg>API
          </a>
          <button class="btn btn--ghost btn--small" type="button" id="sign-out">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-logout"/></svg>Salir
          </button>
        </div>
        <p class="sidebar__version" id="version"></p>
      </div>
    </aside>
    <button class="scrim" id="scrim" type="button" aria-label="Cerrar el menú" tabindex="-1" hidden></button>

    <div class="main">
      <header class="topbar">
        <button class="icon-button" type="button" id="menu-button" aria-label="Menú" aria-controls="sidebar"
          aria-expanded="false">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-menu"/></svg>
        </button>
        <img src="/icons/icon.svg" width="28" height="28" alt="">
        <p class="topbar__title" id="topbar-title">Administración</p>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

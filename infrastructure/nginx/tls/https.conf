# HTTPS server. Mounted over conf.d/default.conf by docker-compose.prod.yml when
# NGINX_SERVER_CONF=./infrastructure/nginx/tls/https.conf. Certificates are read
# from /etc/nginx/certs (fullchain.pem + privkey.pem), never stored in Git.
server {
  listen 80 default_server;
  server_name _;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # HSTS: added per location (snippets/security-headers.conf) and by the backend.

  include /etc/nginx/snippets/maps-platform.conf;
}

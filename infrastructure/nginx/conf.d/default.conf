# HTTP server (development, or production behind a TLS-terminating load balancer).
# For TLS on this Nginx use tls/https.conf instead (see docker-compose.prod.yml).
# IPv4 only: Docker networks have no IPv6 unless enabled explicitly (then add
# `listen [::]:80 default_server;`).
server {
  listen 80 default_server;
  server_name _;

  include /etc/nginx/snippets/maps-platform.conf;
}

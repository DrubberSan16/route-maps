# Reverse proxy and static server of the maps platform. It is the only service
# published to the outside world (see docker-compose.yml).
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  # ES modules (the viewer loads MapLibre GL JS as .mjs); browsers refuse module
  # scripts served as application/octet-stream. The web app manifest, the
  # Android app (APK) offered for download and the offline packs of the phone
  # (routes and search without connection). Adds to the mime.types above.
  types {
    text/javascript mjs;
    application/manifest+json webmanifest;
    application/vnd.android.package-archive apk;
    application/vnd.route-maps.offline-pack rmpack;
  }
  default_type application/octet-stream;

  # One JSON line per request; request_id is shared with the backend logs.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","range":"$http_range",'
    '"user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  server_tokens off;

  # The backend accepts JSON bodies up to 5 MB (sync batches, tracking batches).
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  # text/javascript: the viewer's ES modules (.mjs, about 1 MB of MapLibre); application/x-protobuf:
  # the label glyphs. The static files are also gzipped when the image is built (gzip_static).
  gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml
             application/manifest+json
             application/x-protobuf;
  # PMTiles archives are read with Range requests and their tiles are already compressed: never gzip them.

  # A PMTiles URL with ?v=<content hash> (as listed by GET /maps/regions) never changes: browsers
  # keep it for good and a new build gets a new URL. Without it, one hour.
  map $arg_v $pmtiles_cache_control {
    "" "public, max-age=3600";
    default "public, max-age=31536000, immutable";
  }

  # Behind another reverse proxy on the same host (TLS terminated there): its
  # connections arrive from the Docker network gateway and carry the client in
  # X-Forwarded-For. Only Docker networks are trusted for that header, so the
  # rate limits below apply per client and not to the proxy as a whole.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Defense in depth: the backend has its own per-route throttling.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_status 429;

  # Reuse the client's X-Request-Id or create one.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    "" $request_id;
  }

  # HSTS only on HTTPS responses (Nginx does not send headers with empty values).
  map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
  }

  # Ready for WebSockets (live tracking) without changing the proxy settings later.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # Docker's embedded DNS: the backend address is re-resolved when the
  # container is recreated, so Nginx never keeps a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend {
    zone backend 64k;
    server backend:3000 resolve;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}

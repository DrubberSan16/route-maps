# Locations shared by the HTTP (conf.d/default.conf) and HTTPS (tls/https.conf) servers.

# Liveness of Nginx itself (container healthcheck).
location = /nginx-health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Backend health (database, Redis, routing, geocoding).
location ~ ^/health(/live)?$ {
  access_log off;
  include /etc/nginx/snippets/proxy-backend.conf;
}

# REST API and Swagger (/api/docs).
location /api/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy-backend.conf;
}

# Glyphs and the style template used by clients (baked into the image, gzipped at build time).
location /maps/fonts/ {
  alias /usr/share/nginx/maps-assets/fonts/;
  default_type application/x-protobuf;
  gzip_static on;
  expires 30d;
  include /etc/nginx/snippets/pmtiles-cors.conf;
}

location = /maps/style/style.json {
  alias /usr/share/nginx/maps-assets/style/style.json;
  default_type application/json;
  gzip_static on;
  add_header Cache-Control "no-cache" always;
  add_header Access-Control-Allow-Origin "*" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Public, first-party browser SDK. External applications can embed the map and
# call routes/geocoding without depending on a third-party CDN. Its modules
# change together with the style: revalidated on every load (ETag, 304).
location /sdk/ {
  alias /usr/share/nginx/html/sdk/;
  default_type application/javascript;
  gzip_static on;
  add_header Cache-Control "no-cache" always;
  add_header Access-Control-Allow-Origin "*" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Runtime modules used by the SDK. Licences remain available beside the files.
location /vendor/ {
  alias /usr/share/nginx/html/vendor/;
  gzip_static on;
  expires 30d;
  add_header Access-Control-Allow-Origin "*" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Region PMTiles archives for online rendering (pmtiles:// protocol). Nginx
# answers Range requests natively (206, Accept-Ranges: bytes, If-Range).
location ~ ^/maps/(?<pmtiles_path>[A-Za-z0-9._/-]+\.pmtiles)$ {
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Match" always;
    add_header Access-Control-Max-Age 86400 always;
    return 204;
  }
  alias /data/maps/$pmtiles_path;
  types { }
  default_type application/vnd.pmtiles;
  gzip off;
  # Not "always": an error (a file not published yet) must not be kept for a year.
  add_header Cache-Control $pmtiles_cache_control;
  include /etc/nginx/snippets/pmtiles-cors.conf;
}

# Anything else under /maps/ (manifests, temporary files) is not public.
location /maps/ {
  return 404;
}

# Region downloads are authorised by the backend and then served by Nginx
# (X-Accel-Redirect), keeping large transfers out of Node.js.
location /_protected/maps/ {
  internal;
  alias /data/maps/;
  gzip off;
  add_header X-Checksum-Sha256 $upstream_http_x_checksum_sha256 always;
  add_header X-Region-Version $upstream_http_x_region_version always;
  add_header X-Request-Id $req_id always;
  include /etc/nginx/snippets/security-headers.conf;
}

location /_protected/routing/ {
  internal;
  alias /data/routing/;
  gzip off;
  add_header X-Checksum-Sha256 $upstream_http_x_checksum_sha256 always;
  add_header X-Region-Version $upstream_http_x_region_version always;
  add_header X-Request-Id $req_id always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Android app (APK) published on this server by infrastructure/scripts/publish-app.py: the
# description of the latest build (read by the viewer's "Instalar app" button), a stable link to
# it and the kept versions (immutable: a new build gets a new name).
location = /descargas/android.json {
  alias /data/app/android.json;
  types { }
  default_type application/json;
  add_header Cache-Control "no-cache" always;
  add_header Access-Control-Allow-Origin "*" always;
  include /etc/nginx/snippets/security-headers.conf;
}

location = /descargas/route-maps.apk {
  alias /data/app/route-maps.apk;
  gzip off;
  add_header Cache-Control "no-cache" always;
  add_header Content-Disposition 'attachment; filename="route-maps.apk"';
  include /etc/nginx/snippets/security-headers.conf;
}

location ~ ^/descargas/(?<apk_file>route-maps-[A-Za-z0-9._-]+\.apk)$ {
  alias /data/app/$apk_file;
  gzip off;
  # Not "always": a 404 (an old version already removed) must not be kept for a year.
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header Content-Disposition 'attachment; filename="$apk_file"';
  include /etc/nginx/snippets/security-headers.conf;
}

location /descargas/ {
  return 404;
}

# Web app manifest (installable viewer). The service worker (/sw.js) is served by the location
# below and revalidated on every load, so a new release reaches installed copies.
location = /manifest.webmanifest {
  root /usr/share/nginx/html;
  gzip_static on;
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Administration panel (static pages, no build step; it only talks to this server's API). Strict
# content security policy: the scripts, styles, fonts and data of this server only, no inline
# code, never inside a frame. MapLibre runs its worker from /vendor (same origin).
location = /admin {
  # Relative Location: behind a published port (8080) an absolute one would point to port 80.
  absolute_redirect off;
  return 301 /admin/;
}

location /admin/ {
  root /usr/share/nginx/html;
  index index.html;
  try_files $uri $uri/ =404;
  gzip_static on;
  add_header Cache-Control "no-cache" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Developer map viewer (static page, no build step). Its files change with every
# release and must match the style: revalidated on every load (ETag, 304).
location / {
  root /usr/share/nginx/html;
  index index.html;
  try_files $uri $uri/ =404;
  gzip_static on;
  add_header Cache-Control "no-cache" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  include /etc/nginx/snippets/security-headers.conf;
}

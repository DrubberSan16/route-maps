# Locations shared by the HTTP (conf.d/default.conf) and HTTPS (tls/https.conf) servers.

# Liveness of Nginx itself (container healthcheck).
location = /nginx-health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Backend health (database, Redis, routing, geocoding).
location ~ ^/health(/live)?$ {
  access_log off;
  include /etc/nginx/snippets/proxy-backend.conf;
}

# REST API and Swagger (/api/docs).
location /api/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy-backend.conf;
}

# Glyphs and the style template used by clients (baked into the image).
location /maps/fonts/ {
  alias /usr/share/nginx/maps-assets/fonts/;
  default_type application/x-protobuf;
  gzip off;
  expires 30d;
  include /etc/nginx/snippets/pmtiles-cors.conf;
}

location = /maps/style/style.json {
  alias /usr/share/nginx/maps-assets/style/style.json;
  default_type application/json;
  add_header Cache-Control "no-cache" always;
  add_header Access-Control-Allow-Origin "*" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Region PMTiles archives for online rendering (pmtiles:// protocol). Nginx
# answers Range requests natively (206, Accept-Ranges: bytes, If-Range).
location ~ ^/maps/(?<pmtiles_path>[A-Za-z0-9._/-]+\.pmtiles)$ {
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Match" always;
    add_header Access-Control-Max-Age 86400 always;
    return 204;
  }
  alias /data/maps/$pmtiles_path;
  types { }
  default_type application/vnd.pmtiles;
  gzip off;
  add_header Cache-Control "public, max-age=3600" always;
  include /etc/nginx/snippets/pmtiles-cors.conf;
}

# Anything else under /maps/ (manifests, temporary files) is not public.
location /maps/ {
  return 404;
}

# Region downloads are authorised by the backend and then served by Nginx
# (X-Accel-Redirect), keeping large transfers out of Node.js.
location /_protected/maps/ {
  internal;
  alias /data/maps/;
  gzip off;
  add_header X-Checksum-Sha256 $upstream_http_x_checksum_sha256 always;
  add_header X-Region-Version $upstream_http_x_region_version always;
  add_header X-Request-Id $req_id always;
  include /etc/nginx/snippets/security-headers.conf;
}

location /_protected/routing/ {
  internal;
  alias /data/routing/;
  gzip off;
  add_header X-Checksum-Sha256 $upstream_http_x_checksum_sha256 always;
  add_header X-Region-Version $upstream_http_x_region_version always;
  add_header X-Request-Id $req_id always;
  include /etc/nginx/snippets/security-headers.conf;
}

# Developer map viewer (static page, no build step).
location / {
  root /usr/share/nginx/html;
  index index.html;
  try_files $uri $uri/ =404;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  include /etc/nginx/snippets/security-headers.conf;
}

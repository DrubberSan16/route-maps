# PMTiles are read by map clients with HTTP Range requests, also from other origins.
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Match" always;
add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
include /etc/nginx/snippets/security-headers.conf;

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, pruebas y e2e con PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: maps_e2e
          POSTGRES_USER: maps
          # Throwaway database of this job only, reachable from the runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maps -d maps_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Prisma reads DATABASE_URL even for `prisma generate` (npm ci).
      DATABASE_URL: postgresql://maps@localhost:5432/maps_e2e?schema=public
      E2E_DATABASE_URL: postgresql://maps@localhost:5432/maps_e2e?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: npm run test:e2e -- --ci

  tilegen:
    name: Generador de mapas (Planetiler)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: infrastructure/maps/tilegen/pom.xml
      - run: mvn -B -ntp -f infrastructure/maps/tilegen/pom.xml verify

  consistency:
    name: Configuración y recursos compartidos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: El estilo publicado es el que genera build-style.py
        run: |
          python3 infrastructure/maps/style/build-style.py
          git diff --exit-code -- infrastructure/maps/style mobile/assets/map
      - name: La app usa el mismo estilo que el servidor
        run: cmp infrastructure/maps/style/style.json mobile/assets/map/style.json
      - name: Visor web y SDK (sintaxis y pruebas)
        run: |
          for file in infrastructure/nginx/html/*.js infrastructure/nginx/html/sdk/*.js; do node --check "$file"; done
          jq -e '.name and .start_url and (.icons | length >= 3)' infrastructure/nginx/html/manifest.webmanifest
          node --test 'infrastructure/nginx/tests/*.test.mjs'
      - name: La app lleva los mismos glifos que sirve Nginx
        run: diff -r --exclude=README.md infrastructure/maps/fonts mobile/assets/fonts
      - name: La app usa el logo y las miniaturas de tipo de mapa del visor
        run: |
          cmp infrastructure/nginx/html/icons/icon-192.png mobile/assets/images/logo.png
          for type in map satellite relief; do
            cmp "infrastructure/nginx/html/icons/map-type-$type.webp" "mobile/assets/images/map-type-$type.webp"
          done
      - name: Catálogo de regiones válido
        run: jq -e '.regions | length > 0 and all(.code | test("^[a-z0-9][a-z0-9-]{1,62}$"))' infrastructure/regions/regions.json
      - name: Docker Compose válido (desarrollo y producción)
        run: |
          ./infrastructure/scripts/init-env.sh
          docker compose config --quiet
          docker compose --profile tools --profile geocoding config --quiet
          CORS_ORIGINS=https://maps.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  mobile:
    name: App Flutter (análisis, pruebas y APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formato (sin el código generado por build_runner)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart')
      - run: flutter analyze
      - name: Código generado de Drift al día
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: flutter test
      - name: APK de release (firmado con la clave de depuración si no hay key.properties)
        # Apunta al servidor de producción (variable del repositorio API_BASE_URL).
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://route-map.softwareeasydev.com' }}
      - name: El APK se publica para el botón «Instalar app» (versión leída del propio APK)
        run: |
          python3 ../infrastructure/scripts/publish-app.py build/app/outputs/flutter-apk/app-release.apk \
            --storage "$RUNNER_TEMP/storage"
          version="$(sed -n 's/^version: *\([^+]*\)+\(.*\)$/\1 \2/p' pubspec.yaml)"
          jq -e --arg version "${version% *}" --argjson build "${version#* }" \
            '.package == "com.mapsplatform.maps_platform" and .version == $version and .build == $build
             and .minSdk >= 21 and (.url | startswith("/descargas/route-maps-"))' "$RUNNER_TEMP/storage/app/android.json"
          cmp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/storage/app/route-maps.apk"
      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: maps-platform-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: App iOS (compilación sin firma)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  stack:
    # The national map data (INEC, several GB) is built on a workstation and published with
    # infrastructure/scripts/publish-region.sh; CI checks the whole stack without map data and
    # without downloading anything from third-party map services.
    name: Stack Docker completo (sin datos cartográficos)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Crear .env con secretos aleatorios
        run: make init
      - name: Construir y levantar el stack
        run: make up
      - name: Esperar a que todos los servicios estén sanos
        run: docker compose up -d --wait --wait-timeout 600
      - name: Prueba de humo a través de Nginx (sin regiones preparadas)
        run: ALLOW_NO_REGION=1 ./infrastructure/scripts/smoke-test.sh http://localhost:8080
      - name: Estado y logs de los servicios
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300
      - name: Apagar el stack
        if: always()
        run: docker compose down -v

# Maps Platform - local / development stack.
#
#   cp .env.example .env          # or: make init (generates random secrets)
#   docker compose up -d --build
#
# Only Nginx publishes a port. PostgreSQL, Redis and the backend live in the
# private network maps-network (internal: no Internet access or published ports).
#
# Audited source snapshots and PMTiles maps live in ./storage
# (STORAGE_PATH) and is prepared on demand with the data-tools image:
#   make prepare-region REGION=guayaquil
# Nothing is downloaded or processed during `docker compose up`.
#
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Legacy engines are optional migration aids and are never started by default.
name: maps-platform

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  nginx:
    build:
      context: ./infrastructure
      dockerfile: nginx/Dockerfile
    image: ${IMAGE_PREFIX:-maps-platform}/nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      # PMTiles served with Range requests (/maps/...) and region downloads
      # authorised by the backend (X-Accel-Redirect). Read-only.
      - ${STORAGE_PATH:-./storage}/maps:/data/maps:ro
      - ${STORAGE_PATH:-./storage}/routing:/data/routing:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [edge, maps-network]
    logging: *logging

  backend:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-maps-platform}/backend:${IMAGE_TAG:-latest}
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:-maps}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-maps}?schema=public
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-native}
      ROUTING_LANGUAGE: ${ROUTING_LANGUAGE:-es-ES}
      ROUTING_MAX_ALTERNATIVES: ${ROUTING_MAX_ALTERNATIVES:-2}
      NATIVE_ROUTING_GRAPH_FILE: ${NATIVE_ROUTING_GRAPH_FILE:-/data/native/ecuador/roads.geojson}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-native}
      NATIVE_DATA_PATH: ${NATIVE_DATA_PATH:-/data/native/ecuador}
      GEOCODING_COUNTRY_CODES: ${GEOCODING_COUNTRY_CODES:-}
      MAP_STORAGE_PATH: /data/maps
      ROUTING_STORAGE_PATH: /data/routing
      PUBLIC_TILES_BASE_URL: ${PUBLIC_TILES_BASE_URL:-/maps}
      MAP_DOWNLOAD_ACCEL_REDIRECT: "true"
      REGIONS_SYNC_ON_STARTUP: "true"
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    volumes:
      # Region manifests and files (read-only: the data-tools image writes them).
      - ${STORAGE_PATH:-./storage}/maps:/data/maps:ro
      - ${STORAGE_PATH:-./storage}/routing:/data/routing:ro
      - ${STORAGE_PATH:-./storage}/imports/native:/data/native:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 20s
    networks: [maps-network]
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:17-3.5}
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-maps}
      POSTGRES_USER: ${DATABASE_USER:-maps}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # CREATE EXTENSION postgis on the first initialisation of the volume.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [maps-network]
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      # Used by redis-cli in the healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [maps-network]
    logging: *logging

  # ---- On demand: region data pipeline (make prepare-region REGION=...) ----
  data-tools:
    profiles: [tools]
    build:
      context: ./infrastructure
      dockerfile: data-tools/Dockerfile
    image: ${IMAGE_PREFIX:-maps-platform}/data-tools:${IMAGE_TAG:-latest}
    environment:
      TILEGEN_MEMORY: ${TILEGEN_MEMORY:-2g}
      REGION_VERSION: ${REGION_VERSION:-}
    volumes:
      - ${STORAGE_PATH:-./storage}/imports:/data/imports
      - ${STORAGE_PATH:-./storage}/maps:/data/maps
      - ${STORAGE_PATH:-./storage}/routing:/data/routing
    # Needs Internet access to download extracts, nothing else.
    networks: [edge]
    logging: *logging

networks:
  # Public side: only Nginx publishes ports; data-tools uses it to download extracts.
  edge: {}
  # Private network of the platform: no Internet access, nothing published.
  maps-network:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
